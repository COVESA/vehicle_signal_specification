repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types: ["csv"]
      - id: end-of-file-fixer
        exclude_types: ["json"]
      - id: check-yaml
        types: [file]
        files: \.(yaml|yml|vspec)$
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.9.10"]
        files: ^spec/.*\.vspec$
        args: ["--write", "--parser", "yaml"]
